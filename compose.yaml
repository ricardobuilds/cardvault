services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      # Expose PostgreSQL to Rails running locally on macOS.
      - "${POSTGRES_PORT}:5432"

volumes:
  postgres_data:
